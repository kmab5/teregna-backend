# Fails the PR when Supabase's own preview-branch deployment fails, so a broken
# migration cannot slip through green CI. Pair this with a required status check
# on "Supabase Preview" in the repository branch-protection settings.
name: Branch Status

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, develop]
    paths:
      - 'supabase/**'

jobs:
  failed:
    runs-on: ubuntu-latest
    steps:
      - uses: fountainhead/action-wait-for-check@v1.2.0
        id: check
        with:
          checkName: Supabase Preview
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ steps.check.outputs.conclusion == 'failure' }}
        run: |
          echo "::error::Supabase preview branch deployment failed."
          exit 1
