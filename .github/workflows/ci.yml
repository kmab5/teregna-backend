name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs the Supabase CLI pinned in package.json, so CI runs exactly the
      # version contributors run locally. No separate CLI setup action needed.
      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        # Applies every migration in supabase/migrations in order, then seed.sql.
        # A migration that does not apply cleanly fails the build here.
        run: npx supabase start

      - name: Rebuild from scratch
        # Catches migrations that only work against an already-migrated database.
        run: npx supabase db reset

      - name: Run pgTAP tests
        run: npx supabase test db

      - name: Lint database schema
        run: npx supabase db lint --level warning

      - name: Detect uncommitted schema drift
        # The checked-in migrations must fully describe the database. Output here
        # means someone changed the database without writing a migration.
        run: |
          npx supabase db diff --schema public > /tmp/drift.sql
          if [ -s /tmp/drift.sql ]; then
            echo "::error::Schema drift detected - a change was made without a migration."
            cat /tmp/drift.sql
            exit 1
          fi
          echo "No drift."

      - name: Check generated types are committed
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts types/database.types.ts > /dev/null 2>&1; then
            echo "::error::types/database.types.ts is stale. Run 'npm run types' and commit."
            diff /tmp/database.types.ts types/database.types.ts || true
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      - name: Type check
        run: deno check supabase/functions/**/index.ts
